name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    # Intel host avoids arm64 runner capacity failures; release stays arm64.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Core tests
        run: swift test
      - name: Standalone regression checks
        run: swift run PlacementChecks
      - name: Native hover checks (offscreen)
        run: ./script/check_hover.sh
      - name: External CPU monitor (compile only)
        run: swiftc -swift-version 6 script/measure_service_cpu.swift -o .build/ServiceCPU
      - name: Release bundle
        run: ./script/build_and_run.sh --release
      - name: Validate bundle
        run: |
          codesign --verify --strict dist/Rightnest.app
          lipo dist/Rightnest.app/Contents/MacOS/Rightnest -verify_arch arm64
          if strings dist/Rightnest.app/Contents/MacOS/Rightnest | grep -E -- '--verify-textedit|--verify-safari|--verify-finder|--verify-app|--audit-compatibility|--stability-seconds|--measure-idle'; then exit 1; fi
      - name: Archive bundle preserving permissions
        run: ditto -c -k --keepParent dist/Rightnest.app dist/Rightnest-ci.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Rightnest-unsigned-ci-build
          path: dist/Rightnest-ci.zip
          retention-days: 7
